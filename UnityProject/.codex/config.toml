# Project-scoped MCP servers for sessions started inside UnityProject.

[mcp_servers.codedb-mcp]
command = "cmd"
args = ["/c", ".codedb-mcp\\run-mcp.cmd"]
cwd = "."
startup_timeout_sec = 30

[mcp_servers.mempalace]
command = "cmd"
args = ["/c", "tools\\mcp\\run-mempalace.cmd"]
cwd = "."
startup_timeout_sec = 90
